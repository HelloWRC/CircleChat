# Replace the contents of the site's existing proxy include with this file.
# This site is served over HTTPS by the CDN; CDN -> Nginx uses HTTP on port 80.
# $connection_upgrade uses the same http-level map as the existing panel config.

#PROXY-START/
location ^~ /
{
    proxy_pass http://localhost:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    # $scheme is http on this CDN origin, although the browser uses HTTPS.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    # Use the canonical values above instead of a conflicting inbound header.
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    add_header X-Cache $upstream_cache_status;

    set $static_filemJiZwUmf 0;
    if ( $uri ~* "\.(gif|png|jpg|css|js|woff|woff2)$" )
    {
        set $static_filemJiZwUmf 1;
        expires 1m;
    }
    if ( $static_filemJiZwUmf = 0 )
    {
        add_header Cache-Control no-cache;
    }
}
#PROXY-END/
