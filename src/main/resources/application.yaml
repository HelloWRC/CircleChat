server:
  # Restore the public scheme/host after TLS terminates at the reverse proxy.
  forward-headers-strategy: framework

spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  application:
    name: CircleChat
  jpa:
    hibernate:
      ddl-auto: update

chat:
  persistence:
    capacity: ${CHAT_PERSISTENCE_CAPACITY:10000}
    shutdown-millis: ${CHAT_PERSISTENCE_SHUTDOWN_MILLIS:30000}
    retry-millis: ${CHAT_PERSISTENCE_RETRY_MILLIS:1000}
    max-retry-millis: ${CHAT_PERSISTENCE_MAX_RETRY_MILLIS:30000}
